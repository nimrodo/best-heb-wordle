[project]
name = "wordlists"
version = "0.1.0"
description = "Offline pipeline that builds the Hebrew Wordle word lists"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
wordlists = "wordlists:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
